Object.assign(VOICES,{"story_bell_title":"Полина, слышишь? Динь-динь! Это колокольчик Беляша! Ой, ветер унёс его на полянку! Пойдём по следам. Друзья помогут найти пропажу.","story_bell_1_intro":"Ух ты! Жёлтые лепестки! Беляш, носом сюда! Полина, найдём цветочки и соберём душистый букет.","story_bell_1_outro":"Какой букет! Беляш чихнул: «Апчхи!» А вот и следы под цветочком. Пойдём дальше, Полина!","story_bell_2_intro":"Кто здесь прячется? Зайчонок! Он слышал звон. Полина, соберём гостинцы и позовём лесных помощников.","story_bell_2_outro":"Ура, все собрались! Зайчонок показал тропинку. Беляш виляет хвостом. За цветами что-то блестит! Проверим?","story_bell_3_intro":"Динь! Колокольчик на низкой веточке! Подберём ленточку, продолжим узор и соберём букет. Совсем рядом!","story_bell_3_outro":"Нашли! Беляш, держи колокольчик! Динь-динь! Спасибо, Полина! А теперь домой: покажем наш звонкий подарок.","story_cloud_title":"Ту-ту! Беляш сегодня — машинист облачного поезда! Полина, нам нужны мостик, шестерёнки и билеты. Вместе поможем пассажирам добраться до солнечной станции?","story_cloud_1_intro":"Ого, рельсы заканчиваются! Нужен мостик. Полина, подберём детали по форме и длине. Беляш готов!","story_cloud_1_outro":"Отличный мостик, крепкий и ровный! Беляш проверил мостик лапкой. Ту-ту! Теперь можно собрать маленький поезд!","story_cloud_2_intro":"Вагончики готовы, а колёса не крутятся! Беляш, погоди! Полина посчитает детали и соберёт шестерёнки.","story_cloud_2_outro":"Щёлк-щёлк! Завертелись! Поезд покатился. Беляш надел фуражку. Полина, осталось найти солнечную станцию! Вперёд!","story_cloud_3_intro":"Ту-ту! Солнечная станция за облаком. Полина, покажем путь, посчитаем цветочки и посадим пассажиров. Поехали!","story_cloud_3_outro":"Приехали! Солнышко машет нам лучиком. Беляш, ты замечательный машинист! Полина, облачный поезд теперь твой!","story_stars_title":"Вечер укрыл полянку синим одеялом. Беляш нашёл маленький огонёк! Полина, зажжём добрую звёздную тропинку, сыграем мелодию и вернёмся в уютный домик.","story_stars_1_intro":"Смотри, светлячки проснулись! Раз, два… Полина, посчитаем огоньки и соединим звёздочки. Беляш поможет искать!","story_stars_1_outro":"Засветилось! Теперь тропинку видно. Беляш радостно подпрыгнул. Слышишь? Вдали кто-то играет! Давай послушаем!","story_stars_2_intro":"Тинь-тонь! Звёздный оркестр! Полина, найдём пары, продолжим узор и повторим мелодию. Беляш отбивает ритм хвостиком!","story_stars_2_outro":"Получилось! Как красиво! Звёздочки подмигнули в ответ. Беляш зевнул. Давай зажжём звёздную лапку — и домой!","story_stars_3_intro":"Пять звёздочек спрятались в небе! Полина, найдём дорожку и соединим звёздочки по порядку. Вот так!","story_stars_3_outro":"Ух ты, звёздная лапка Беляша! Тропинка светится, домик рядом. Спасибо, Полина! Спокойной ночи, путешественники.","success1":"Получилось! Посмотри, как здорово.","success2":"Вот это находка! Идём дальше.","success3":"Ура! Ещё одно маленькое открытие.","success4":"Ты нашла ответ. Давай порадуемся!","retry1":"Давай попробуем ещё раз. Я рядом.","retry2":"Давай поищем. Тут есть ответ.","retry3":"Спокойно ищем ответ. Я помогу.","hint1":"Вот подсказка. Посмотрим на неё вместе.","hint2":"Подсказка рядом. Попробуй ещё раз.","pet_feed1":"Ням-ням! Беляшу понравилось угощение.","pet_feed2":"Вот так угощение! Беляш очень доволен.","pet_feed3":"Спасибо за заботу! Как вкусно.","pet_play1":"Лови мяч, Беляш! Вот это прыжок.","pet_play2":"Ещё бросок! Беляш так рад игре.","pet_play3":"Мячик скачет, а хвостик виляет.","pet_brush1":"Как приятно! Шёрстка стала мягкой.","pet_brush2":"Вот так забота! Беляш сияет от радости.","pet_brush3":"Расчешем ушки и погладим спинку.","mini_finish1":"Ура! Ещё один этап пройден.","mini_finish2":"Мы справились! Как здорово получилось.","mini_finish3":"Спасибо за игру! Отдохнём или сыграем ещё.","levelup1":"Новая ступенька! Впереди ещё больше открытий.","levelup2":"Ура! Ещё одно умение в нашей копилке."});

const $=s=>document.querySelector(s);
const root=$('#app');
const safeStore={read(){try{return JSON.parse(localStorage.getItem('fox-forest-v1')||'{}')}catch{return {}}},write(v){try{localStorage.setItem('fox-forest-v1',JSON.stringify(v))}catch{}}};
const saved=safeStore.read();
const state={screen:'home',sound:saved.sound!==false,history:Array.isArray(saved.history)?saved.history:[],flowers:Number(saved.flowers)||0,queue:[],index:0,session:[],selected:[],solved:false,busy:false,attempts:0,hints:0,showHint:false,deck:[],open:[],matched:[],steps:[],position:0,token:0,breakDone:false};

function save(){safeStore.write({sound:state.sound,history:state.history.slice(-80),flowers:state.flowers})}
function stopVoice(){const previous=playing;playing=null;if(previous){try{previous.pause();previous.currentTime=0}catch{}}document.body.classList.remove('speaking')}

function button(action,label,icon,cls='',extra=''){return `<button type="button" class="btn ${cls}" data-action="${action}" aria-label="${label}" title="${label}" ${extra}>${ui(icon)}</button>`}

function home(){stopVoice();state.screen='home';state.token++;state.busy=false;root.innerHTML=`<div class="page home-page">${header()}<main><section class="hero"><div class="hero-copy"><div class="eyebrow"><i></i>ИГРАЕМ. ПРОБУЕМ. ОТКРЫВАЕМ.</div><h1>У маленьких открытий<br>большое <em>будущее.</em></h1><p class="hero-sub">Лесное приключение с лисёнком Феней.<br>Слушай, выбирай картинки и помогай друзьям.</p><div class="hero-buttons"><button class="btn primary start-button" data-action="start" aria-label="Начать смешанное приключение">${ui('play')}<span>Начать приключение<small>6 маленьких заданий</small></span></button>${button('welcome','Послушать приветствие лисёнка','speaker','round welcome')}</div><div class="hero-notes"><span>${ui('speaker')}Все задания озвучены</span><span>${ui('heart')}Можно пробовать снова</span></div></div><div class="hero-picture">${forest()}<div class="hello-bubble">Привет, я Феня!<span>Будем играть?</span></div><span class="picture-tag">Слушаем. Думаем. Играем.</span></div></section><section class="worlds"><div class="section-heading"><div><span class="eyebrow">ВЫБЕРИ СВОЮ ПОЛЯНКУ</span><h2>Четыре маленьких мира</h2></div><p>По 4 задания в каждом.<br>В своём темпе, без спешки.</p></div><div class="world-grid">${GROUPS.map((g,i)=>`<button class="world-card ${g.tone}" data-action="group" data-group="${i}" aria-label="Играть: ${g.title}"><div class="world-top"><span class="world-count">0${i+1}</span><span class="world-play">${ui('play')}</span></div><div class="world-illustration">${art(g.icon,i===0?'yellow':undefined)}</div><h3>${g.title}</h3><p>${g.sub}</p><span class="world-bottom">4 задания <span>Слушай и играй ${ui('next')}</span></span></button>`).join('')}</div></section><section class="quiet-note">${art('leaf')}<p>Каждая попытка — открытие.<br><strong>Здесь не торопят и не отнимают награды.</strong></p><span class="garden-count">${art('flower','yellow')}<b>${state.flowers}</b><small>${ruPlural(state.flowers,'цветочек','цветочка','цветочков')} в саду</small></span></section></main><footer><span>Лисий лес · первая коллекция игр</span><button data-action="parents">Как заниматься вместе</button></footer></div>`;window.scrollTo(0,0)}
function start(ids){stopVoice();state.queue=[...ids];state.index=0;state.session=[];state.breakDone=false;beginTask()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function task(){return TASKS[state.queue[state.index]]}
function beginTask(){state.token++;state.screen='game';state.selected=[];state.solved=false;state.busy=false;state.attempts=0;state.hints=0;state.showHint=false;state.open=[];state.matched=[];state.steps=[];state.order=task().options?shuffle(task().options.map((_,i)=>i)):[];state.position=task().start??0;state.deck=task().type==='memory'?shuffle(task().pairs.flatMap(k=>[k,k])):[];renderGame();window.scrollTo(0,0);speak(task().voice)}
function progress(){return `<div class="progress" aria-label="Выполнено ${state.index} из ${state.queue.length} ${ruPlural(state.queue.length,'задания','заданий','заданий')}">${state.queue.map((id,i)=>`<span class="seed ${i<state.index?'done':''} ${i===state.index?'current':''}">${i<state.index?art('leaf'):''}</span>`).join('')}</div>`}
function option(item,i,extra=''){return `<button type="button" class="choice ${state.selected.includes(i)?'selected':''} ${state.showHint&&task().correct===i?'hinted':''}" data-action="choose" data-option="${i}" aria-label="${item.label||'Картинка '+(i+1)}" ${state.solved||state.busy?'disabled':''} ${extra}>${art(item.kind,item.color)}<span class="selection-mark">${ui('check')}</span></button>`}
function renderStage(t){
 if(t.type==='choice'||t.type==='shadow')return `${t.sample?`<div class="sample ${t.type==='shadow'?'shadow':''}">${art(t.sample.kind,t.sample.color)}<span class="sample-label">${t.type==='shadow'?'Чья это тень?':'Найди такой же'}</span></div>`:''}<div class="choices ${t.options.length===4?'four':''}">${state.order.map(i=>option(t.options[i],i)).join('')}</div>`;
 if(t.type==='pattern')return `<div class="pattern-line">${t.sequence.map(o=>`<div class="pattern-item">${art(o.kind,o.color)}</div>`).join('')}<div class="pattern-item question">?</div></div><div class="choices">${state.order.map(i=>option(t.options[i],i)).join('')}</div>`;
 if(t.type==='multi')return `<div class="choices four">${state.order.map(i=>option(t.options[i],i)).join('')}</div><div class="check-line">${button('check','Проверить выбранные фрукты','check','primary check-button',state.solved?'disabled':'')}</div>`;
 if(t.type==='collect')return `<div class="collection"><div class="berry-patch">${Array.from({length:t.total},(_,i)=>`<button class="berry-pick ${state.selected.includes(i)?'picked':''}" data-action="collect" data-option="${i}" aria-label="${state.selected.includes(i)?'Вернуть':'Взять'} ягодку ${i+1}" aria-pressed="${state.selected.includes(i)}" ${state.solved?'disabled':''}>${art(t.object)}${state.selected.includes(i)?`<span>${ui('check')}</span>`:''}</button>`).join('')}</div><div class="basket-area"><div class="target-dots">${dots(t.count)}</div><div class="basket-drawing">${art('basket')}<div class="basket-fruit">${state.selected.map(()=>art(t.object)).join('')}</div></div><span class="basket-tip">${state.selected.length?'В корзинке':'Нажимай на ягодки'}</span></div></div><div class="check-line">${button('check','Проверить количество ягод','check','primary check-button',state.solved?'disabled':'')}</div>`;
 if(t.type==='count')return `<div class="count-scene">${Array.from({length:t.count},()=>`<div class="count-object">${art(t.object,t.object==='flower'?'yellow':undefined)}</div>`).join('')}</div><div class="choices dot-choices">${state.order.map(i=>{const n=t.options[i];return `<button class="choice dot-card ${state.showHint&&i===t.correct?'hinted':''}" data-action="choose" data-option="${i}" aria-label="${n} ${ruPlural(n,'точка','точки','точек')}" ${state.solved?'disabled':''}>${dots(n)}</button>`}).join('')}</div>`;
 if(t.type==='more')return `<div class="choices more-choices">${state.order.map(i=>{const n=t.options[i];return `<button class="choice apple-meadow ${state.showHint&&i===t.correct?'hinted':''}" data-action="choose" data-option="${i}" aria-label="На полянке ${n} ${ruPlural(n,'яблоко','яблока','яблок')}" ${state.solved?'disabled':''}><span class="meadow-fruits">${Array.from({length:n},()=>art(t.object)).join('')}</span>${art('basket')}</button>`}).join('')}</div>`;
 if(t.type==='memory')return `<div class="memory-grid">${state.deck.map((k,i)=>{const visible=state.open.includes(i)||state.matched.includes(i);return `<button class="memory-card ${visible?'flipped':''} ${state.matched.includes(i)?'matched':''}" data-action="memory" data-card="${i}" aria-label="${visible?({apple:'Яблоко',leaf:'Листик',mushroom:'Гриб'})[k]:'Закрытая карточка '+(i+1)}" ${state.busy||state.matched.includes(i)||state.solved?'disabled':''}>${visible?art(k):art('leaf')}<span>${state.matched.includes(i)?ui('check'):''}</span></button>`}).join('')}</div>`;
 if(t.type==='route')return `<div class="route-layout"><div class="route-board" style="--cols:${t.cols}">${Array.from({length:t.cols*t.rows},(_,i)=>`<div class="route-cell ${t.path.includes(i)?'path-cell':'grass-cell'} ${state.showHint&&t.path.includes(i)?'hint-path':''}" data-cell="${i}">${state.position===i?`<div class="route-fox">${art('fox')}</div>`:i===t.goal?art(state.queue[state.index]==='route2'?'owl':state.queue[state.index]==='route3'?'berry':'bunny'):t.path.includes(i)?'<i></i>':art('leaf')}</div>`).join('')}</div><div class="route-tools"><div class="direction-pad">${['up','left','down','right'].map(d=>button('direction',({up:'Шаг вверх',left:'Шаг влево',down:'Шаг вниз',right:'Шаг вправо'})[d],d,`direction ${d}`,`data-direction="${d}" ${state.busy||state.solved?'disabled':''}`)).join('')}</div><div class="route-play">${button('undo','Убрать последний шаг','undo','round',state.busy||state.solved?'disabled':'')}${button('run','Выполнить шаги','play','primary round',state.busy||state.solved?'disabled':'')}</div></div></div><div class="step-sequence" aria-label="Программа лисёнка">${state.steps.length?state.steps.map(d=>`<span class="step">${ui(d)}</span>`).join(''):'<span class="steps-empty">Собери дорожку из стрелок</span>'}</div>`;
 return '';
}
function renderGame(){state.screen='game';const t=task();const g=GROUPS[t.group];root.innerHTML=`<div class="page game-page">${header(true)}<main class="game-main"><div class="game-nav">${button('home','На главную полянку','home','round')}${progress()}${button('pause','Сделать перерыв','pause','round')}</div><div class="game-heading"><div><span class="eyebrow">${g.title}</span><h1>${t.title}</h1></div><span class="task-number">${state.index+1}<span> / ${state.queue.length}</span></span></div><div class="game-body"><section class="play-stage type-${t.type} ${state.solved?'is-solved':''}" aria-label="Игровое поле">${renderStage(t)}${state.solved?`<div class="success-badge">${ui('check')}Получилось!</div>`:''}</section><aside class="guide"><div class="guide-top"><div class="guide-face">${art('fox')}</div><span>Феня рядом<small>Я помогу!</small></span></div><button class="listen-button" data-action="replay" aria-label="Послушать задание ещё раз">${ui('speaker')}<span>Послушай задание<small>Нажми, чтобы повторить</small></span><i></i></button><p class="guide-instruction">${shortInstruction(t)}</p><div class="guide-bottom">${button('hint','Получить подсказку','bulb','round hint-button',state.solved||state.busy?'disabled':'')}<span>Нужна подсказка?<br>Нажми на лампочку</span></div><div class="feedback ${state.solved?'positive':''}" role="status">${state.solved?'У тебя получилось!':state.showHint?'Подсказка включена. Попробуй ещё раз.':'Можно не спешить.'}</div></aside></div><div class="game-bottom"><span class="gentle-line">${art('leaf')}Каждая попытка помогает учиться</span>${state.solved?`<button class="btn primary next-button" data-action="next" aria-label="Следующее задание"><span>${state.index===state.queue.length-1?'Моя награда':'Дальше'}</span>${ui('next')}</button>`:`<span class="bottom-voice">${ui('speaker')}Слушай и нажимай на картинки</span>`}</div></main></div>`;if(state.solved)$('[data-action="next"]')?.focus({preventScroll:true})}
function shortInstruction(t){const m={choice:'Нажми на подходящую картинку.',shadow:'Найди зверька по его тени.',pattern:'Посмотри на дорожку и выбери продолжение.',multi:'Выбери фрукты, затем нажми галочку.',collect:'Нажми на три ягодки, затем на галочку.',count:'Сосчитай картинки. Выбери столько же точек.',more:'Выбери полянку, где яблок больше.',memory:'Открывай по две карточки. Найди все пары.',route:'Сначала стрелки. Потом зелёный треугольник.'};return m[t.type]}
function success(){if(state.solved)return;state.solved=true;state.busy=false;state.session.push({id:state.queue[state.index],group:task().group,attempts:state.attempts,hints:state.hints});renderGame();speak('good')}
function wrong(key='retry'){state.attempts++;if(state.attempts>=2){state.showHint=true;state.hints++;renderGame();speak(task().hint)}else{speak(key);const f=$('.feedback');if(f)f.textContent='Посмотрим ещё раз. Попробуй другую картинку.';$('.play-stage')?.classList.add('try-again')}}
function choose(i){if(state.solved||state.busy)return;const t=task();if(t.type==='multi'){state.selected=state.selected.includes(i)?state.selected.filter(n=>n!==i):[...state.selected,i];renderGame();return}if(i===t.correct){state.selected=[i];success()}else wrong()}
function collect(i){if(state.solved||state.busy)return;state.selected=state.selected.includes(i)?state.selected.filter(n=>n!==i):[...state.selected,i];renderGame()}

function memory(i){if(state.solved||state.busy||state.open.includes(i)||state.matched.includes(i))return;state.open.push(i);if(state.open.length===2){const [a,b]=state.open;if(state.deck[a]===state.deck[b]){state.matched.push(a,b);state.open=[];if(state.matched.length===state.deck.length){success();return}}else{state.attempts++;state.busy=true;const token=state.token;setTimeout(()=>{if(token!==state.token)return;state.open=[];state.busy=false;if(state.screen==='game')renderGame()},1200)}}renderGame()}
function direction(d){if(state.busy||state.solved)return;if(state.steps.length>=8){speak('routeFull');return}state.steps.push(d);state.position=task().start;renderGame()}
function nextCell(p,d,t){const x=p%t.cols,y=Math.floor(p/t.cols);const nx=x+({left:-1,right:1}[d]||0),ny=y+({up:-1,down:1}[d]||0);return nx<0||nx>=t.cols||ny<0||ny>=t.rows?-1:ny*t.cols+nx}
function run(){if(state.busy||state.solved)return;if(!state.steps.length){speak('needSteps');return}stopVoice();state.busy=true;state.position=task().start;renderGame();let step=0;const token=state.token;const tick=()=>{if(token!==state.token||state.screen!=='game')return;const t=task();if(step>=state.steps.length){state.busy=false;if(state.position===t.goal)success();else{state.position=t.start;renderGame();wrong('routeShort')}return}const dest=nextCell(state.position,state.steps[step++],t);if(!t.path.includes(dest)){state.busy=false;state.position=t.start;renderGame();wrong('routeWrong');return}state.position=dest;renderGame();setTimeout(tick,650)};setTimeout(tick,450)}
function rest(isBreak=false){stopVoice();state.token++;state.busy=false;state.open=[];state.position=task().start??0;state.screen=isBreak?'break':'pause';root.innerHTML=`<div class="page rest-page">${header(true)}<main class="rest-card"><span class="eyebrow">${isBreak?'ПОЛОВИНА ПРИКЛЮЧЕНИЯ ПОЗАДИ':'МОЖНО НЕ СПЕШИТЬ'}</span><div class="rest-character">${art('bunny')}<span>${art('leaf')}</span></div><h1>Немного отдохнём?</h1><p>Потянись, помаши руками, посмотри вдаль.<br>Друзья подождут.</p><div class="rest-buttons">${button('home','Вернуться на главную полянку','home','round')}${button('resume','Продолжить игру','play','primary big-round')}${button('replayRest','Послушать ещё раз','speaker','round')}</div><span class="rest-small">Продолжим, когда захочешь</span></main></div>`;window.scrollTo(0,0);speak(isBreak?'break':'pause')}

ong>${state.flowers}</strong>. Разных заданий решено: <strong>${state.seenTaskIds.length} / ${COURSE_TOTAL}</strong>. Незаконченные приключения не попадают в журнал, но отдельные открытия и начатые раскраски сохраняются.</p><table><thead><tr><th>Раздел</th><th>Разные задания</th><th>С подсказками в завершённых играх</th></tr></thead><tbody>${stats}</tbody></table><p class="small-note">Это наблюдение за игрой, а не оценка развития. История, комната и рисунки хранятся только в этом браузере. Онлайн-версия и скачанный файл имеют отдельные сохранения.${state.storageOk?'':' Браузер сейчас не позволяет сохранить данные: проверьте его настройки хранения.'}</p></section><section class="parent-about"><h2>Что выбрано из готовых подходов</h2><p>По открытым материалам <a href="https://www.khanacademy.org/kids/math" target="_blank" rel="noopener">Khan Academy Kids</a> выбраны наглядные количества, сложение и вычитание на предметах, постепенное усложнение. Из описаний <a href="https://www.pbs.org/parents/thrive/pbs-kids-math-games" target="_blank" rel="noopener">PBS KIDS</a> — сортировка по признакам, пары и задачи с формами. У <a href="https://uchi.ru/products/games/s/preschool" target="_blank" rel="noopener">Учи.ру</a> отмечены игровые разделы, озвучка и достижения.</p><p>Здесь своя реализация: девять миров, персонажи, задания, векторные рисунки и комната. Закрытые задания других платформ не копировались. В арифметике количества до пяти показаны предметами, ответы — точками. В раскрасках цифры продублированы точками и произносятся при выборе краски.</p><p>Автономный HTML содержит всю игру и озвучку. Онлайн-версия работает без интернета после полного сохранения; готовность отображается выше. Имя, фотографии и голос ребёнка не запрашиваются. В детских заданиях нет рекламы, внешних ссылок, оплаты, таймеров или потери жизней.</p></section></main></div>`;window.scrollTo(0,0)};

function miniStopAudio(){for(const oscillator of miniOscillators){try{oscillator.stop()}catch{}}miniOscillators.clear()}
function miniUnlockAudio(){
 if(!state.sound)return false;
 try{const AudioContextType=window.AudioContext||window.webkitAudioContext;if(!AudioContextType)return false;if(!miniAudioContext)miniAudioContext=new AudioContextType();if(miniAudioContext.state==='suspended')miniAudioContext.resume()?.catch(()=>{});return true}catch{return false}
}
function miniTone(index,duration=.25){
 if(!state.sound)return;
 try{
  if(!miniUnlockAudio())return;
  const oscillator=miniAudioContext.createOscillator(),gain=miniAudioContext.createGain(),now=miniAudioContext.currentTime;
  oscillator.type='sine';oscillator.frequency.value=[261.63,329.63,392,523.25][index%4];
  gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(.1,now+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
  oscillator.connect(gain);gain.connect(miniAudioContext.destination);oscillator.onended=()=>miniOscillators.delete(oscillator);miniOscillators.add(oscillator);oscillator.start(now);oscillator.stop(now+duration+.02);
 }catch{}
}

function startMiniGame(id,requestedStage){
 const definition=MINI_GAMES.find(game=>game.id===id);if(!definition)return false;
 const stage=requestedStage===undefined?miniStageLimit(definition):Number(requestedStage);
 if(!Number.isInteger(stage)||stage<0||stage>=definition.stages||stage>miniStageLimit(definition))return false;
 stopVoice();miniStopAudio();state.token++;state.screen='mini';state.busy=false;
 const game=state.miniGame={id,stage,solved:false,busy:false,notice:'',found:0,selected:null,wrong:-1,demo:false,demoIndex:-1,demoOrder:null,firstAward:false};
 if(id==='bubbles')miniSetBubbles(game);
 if(id==='puzzle'){
  game.cols=stage===0?2:3;game.rows=2;game.order=shuffle(Array.from({length:game.cols*game.rows},(_,i)=>i));
  if(game.order.every((n,i)=>n===i))[game.order[0],game.order[1]]=[game.order[1],game.order[0]];
 }
 if(id==='music'){game.mode='ready';game.active=-1;game.input=[];game.sequence=shuffle([0,1,2,3]).slice(0,stage+2)}
 if(id==='stars'){game.points=[[[23,70],[50,22],[77,70]],[[26,65],[29,30],[69,30],[76,65]],[[19,43],[38,22],[63,22],[83,43],[51,79]]][stage];game.nextStar=0}
 renderMiniGame();window.scrollTo(0,0);
 if(id==='bubbles')speak('color');
 if(id==='puzzle')showMiniHow();

const fxMedia=typeof window.matchMedia==='function'?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
function fxPoint(element){const r=element?.getBoundingClientRect?.();return r?{x:r.left+r.width/2,y:r.top+r.height/2}:null}
function fxFallback(){return fxPoint(document.querySelector('.play-stage'))||fxPoint(document.querySelector('.mini-panel'))||{x:(Number(window.innerWidth)||800)/2,y:(Number(window.innerHeight)||600)*.45}}
function fxRemove(record){if(!fxActive.delete(record))return;if(record.timer!==null&&typeof clearTimeout==='function')clearTimeout(record.timer);try{record.animation?.cancel?.()}catch{}record.element.remove?.();if(!fxActive.size){fxLayer?.remove?.();fxLayer=null}}
function clearPolinaEffects(){for(const record of [...fxActive])fxRemove(record)}
function fxSync(){const key=String(state.screen)+':'+state.token;if(key!==fxLifecycleKey){clearPolinaEffects();fxLifecycleKey=key;fxMathKey='';fxMathCounts.clear()}}
function fxAllowed(){return !fxMedia?.matches&&!document.hidden&&typeof document.createElement==='function'&&typeof document.body?.appendChild==='function'}
function fxGlyph(kind){if(kind==='berry')return art('berry');if(kind==='paw')return typeof uiPaths!=='undefined'&&uiPaths.paw?ui('paw'):ui('heart');if(kind==='heart')return ui('heart');return ui('star')}
function fxCreate(point,kind,keyframes,duration,dx=0,dy=-36){
 fxSync();if(!fxAllowed())return;
 while(fxActive.size>=FX_PARTICLE_LIMIT)fxRemove(fxActive.values().next().value);
 if(!fxLayer){fxLayer=document.createElement('div');fxLayer.className='polina-fx-layer';fxLayer.setAttribute('aria-hidden','true');fxLayer.style.pointerEvents='none';document.body.appendChild(fxLayer)}
 const node=document.createElement('span');node.className='polina-fx-particle fx-'+kind;node.innerHTML=fxGlyph(kind);node.style.left=point.x+'px';node.style.top=point.y+'px';node.style.color=['#e4be5e','#aa99d4','#8cbea0','#e6a2a9'][fxActive.size%4];node.style.setProperty('--fx-dx',dx+'px');node.style.setProperty('--fx-dy',dy+'px');fxLayer.appendChild(node);
 const record={element:node,animation:null,timer:null};fxActive.add(record);
 if(typeof node.animate==='function'){record.animation=node.animate(keyframes,{duration,easing:'cubic-bezier(.2,.65,.4,1)',fill:'forwards'});record.animation.finished?.then(()=>fxRemove(record),()=>fxRemove(record))}
 else node.style.animation=`polina-fx-drift ${duration}ms ease-out both`;
 record.timer=setTimeout(()=>fxRemove(record),duration+80);return record;
}
function burstPolinaEffects(point=fxFallback(),kind='star',count=8){
 fxSync();if(!fxAllowed())return;
 for(let i=0;i<Math.min(FX_PARTICLE_LIMIT,Math.max(0,count));i++){
  const angle=Math.PI*2*i/Math.max(1,count),distance=29+Math.random()*25,dx=Math.cos(angle)*distance,dy=Math.sin(angle)*distance-23;
  fxCreate(point,kind,[{transform:'translate(-50%,-50%) scale(.45)',opacity:0},{transform:`translate(calc(-50% + ${dx*.55}px),calc(-50% + ${dy*.55}px)) scale(1)`,opacity:.85,offset:.3},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.6)`,opacity:0}],560+Math.random()*160,dx,dy);
 }
}
function fxLater(fn){const token=state.token,screen=state.screen;Promise.resolve().then(()=>{if(state.token===token&&state.screen===screen){fxSync();fn()}})}
function flyPolinaBerry(from,to){if(!from||!to)return;const dx=to.x-from.x,dy=to.y-from.y;fxCreate(from,'berry',[{transform:'translate(-50%,-50%) scale(.65)',opacity:.95},{transform:`translate(calc(-50% + ${dx*.5}px),calc(-50% + ${dy*.5-35}px)) scale(.8)`,opacity:.95,offset:.5},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.35)`,opacity:0}],450,dx,dy)}
if(typeof MutationObserver==='function'){const observer=new MutationObserver(fxSync);observer.observe(root,{childList:true})}
if(fxMedia?.addEventListener)fxMedia.addEventListener('change',()=>{if(fxMedia.matches)clearPolinaEffects()});
if(typeof document.addEventListener==='function')document.addEventListener('visibilitychange',()=>{if(document.hidden)clearPolinaEffects()});

// Counting is optional exploration: only surviving objects count in subtraction.
const fxBaseObjects=objects;
objects=function(kind,count,removed=0){
 if(state.screen!=='game'||task()?.type!=='arithmetic')return fxBaseObjects(kind,count,removed);
 return Array.from({length:count},(_,index)=>{
  const content=art(kind,kind==='flower'?'yellow':undefined);
  if(index<removed)return `<span class="math-object taken-away" aria-hidden="true">${content}<i></i></span>`;
  const id=fxMathCursor++,number=fxMathCounts.get(id),label=(typeof ITEM_NAMES!=='undefined'?ITEM_NAMES[kind]:null)||'Картинка';
  return `<button type="button" class="math-object math-touch ${number?'math-counted':''}" data-action="mathTouch" data-math-index="${id}" aria-label="Посчитать: ${label}, картинка ${id+1}" aria-pressed="${!!number}" ${state.solved||state.busy?'disabled':''}>${content}<em class="math-touch-number" aria-hidden="true">${number||''}</em></button>`;
 }).join('');
};
const fxBaseRenderStage=renderStage;
renderStage=function(t){fxSync();const key=state.token+':'+state.queue?.[state.index];if(key!==fxMathKey){fxMathKey=key;fxMathCounts.clear()}fxMathCursor=0;const html=fxBaseRenderStage(t);if(t.type!=='arithmetic')return html;return `<p class="math-touch-tip">Нажимай на картинки — посчитаем вместе <span id="math-touch-count" role="status" aria-label="Посчитано картинок">${fxMathCounts.size||''}</span></p>`+html};
root.addEventListener('click',event=>{
 const element=event.target.closest?.('[data-action="mathTouch"]');if(!element||element.disabled||state.screen!=='game'||task()?.type!=='arithmetic'||state.solved||state.busy)return;
 const index=Number(element.dataset.mathIndex);if(!Number.isInteger(index)||index<0||index>=fxMathCursor)return;
 let number=fxMathCounts.get(index);if(!number){number=fxMathCounts.size+1;if(number>5)return;fxMathCounts.set(index,number)}
 element.classList.add('math-counted');element.setAttribute('aria-pressed','true');const badge=element.querySelector?.('.math-touch-number');if(badge)badge.textContent=String(number);const meter=document.getElementById('math-touch-count');if(meter)meter.textContent=String(fxMathCounts.size);
 if(state.sound)speak('number'+number);burstPolinaEffects(fxPoint(element)||fxFallback(),'star',3);
});
root.addEventListener('click',event=>{
 const element=event.target.closest?.('[data-action="collect"]');if(!element||element.disabled||state.screen!=='game'||task()?.type!=='collect'||state.solved||state.busy)return;
 const index=Number(element.dataset.option);if(!Number.isInteger(index)||state.selected.includes(index))return;const from=fxPoint(element),token=state.token;
 fxLater(()=>{if(state.token===token&&state.selected.includes(index))flyPolinaBerry(from,fxPoint(document.querySelector('.basket-drawing')))})
},true);

const fxBaseSuccess=success;
success=function(){const wasSolved=state.solved;const result=fxBaseSuccess();if(!wasSolved&&state.solved){fxSync();burstPolinaEffects(fxFallback(),'star',10)}return result};
const fxBaseFillRegion=fillRegion;
fillRegion=function(index){const before=state.painted?.length||0,point=fxPoint(document.querySelector(`[data-action="paint"][data-region="${Number(index)}"]`));const result=fxBaseFillRegion(index);if((state.painted?.length||0)>before){fxSync();const region=document.querySelector(`[data-action="paint"][data-region="${Number(index)}"]`);region?.classList.add('fx-painted-now');burstPolinaEffects(point||fxPoint(region)||fxFallback(),'star',5)}return result};
if(typeof miniWin==='function'){const fxBaseMiniWin=miniWin;miniWin=function(game){const wasSolved=game?.solved;const result=fxBaseMiniWin(game);if(game?.solved&&!wasSolved)fxLater(()=>burstPolinaEffects(fxPoint(document.querySelector('.mini-panel'))||fxFallback(),'paw',9));return result}}
if(typeof petCare==='function'){const fxBasePetCare=petCare;petCare=function(action){const valid=['room','companion'].includes(state.screen)&&typeof COMPANION_ACTIONS!=='undefined'&&Object.hasOwn(COMPANION_ACTIONS,action);const result=fxBasePetCare(action);if(valid){fxSync();burstPolinaEffects(fxPoint(document.querySelector('.companion-nook-dog'))||fxFallback(),'heart',5)}return result}}
const fxBaseFinish=finish;
finish=function(){const result=fxBaseFinish();fxSync();burstPolinaEffects(fxPoint(document.querySelector('.reward-flower'))||fxFallback(),'star',10);return result};
const POLINA_EFFECTS={clear:clearPolinaEffects,activeCount:()=>fxActive.size,mathCount:()=>fxMathCounts.size};

// Short recorded reactions vary independently from the instructional narration.
// Specific task hints, quantities and directions always retain their own clips.
const VOICE_REACTION_GROUPS=Object.freeze({
 success:['success1','success2','success3','success4'],
 retry:['retry1','retry2','retry3'],
 hint:['hint1','hint2'],
 pet_feed:['pet_feed1','pet_feed2','pet_feed3'],
 pet_play:['pet_play1','pet_play2','pet_play3'],
 pet_brush:['pet_brush1','pet_brush2','pet_brush3'],
 mini_finish:['mini_finish1','mini_finish2','mini_finish3'],
 levelup:['levelup1','levelup2']
});
const voiceReactionPrevious=Object.create(null);
let voiceReactionLastKey=null;
let voiceReactionPetAction=null;
const voiceReactionBaseSpeak=speak;

function voiceReactionText(key){return typeof VOICES[key]==='string'?VOICES[key]:''}
function voiceReactionAvailable(key){return Object.hasOwn(AUDIO,key)&&typeof AUDIO[key]==='string'&&AUDIO[key].trim().length>0&&voiceReactionText(key).length>0}
function chooseVoiceReaction(group){
 if(typeof group!=='string'||!Object.hasOwn(VOICE_REACTION_GROUPS,group))return null;
 const candidates=VOICE_REACTION_GROUPS[group].filter(voiceReactionAvailable);
 if(!candidates.length)return null;
 let index=(candidates.indexOf(voiceReactionPrevious[group])+1)%candidates.length;
 if(candidates.length>1&&candidates[index]===voiceReactionLastKey)index=(index+1)%candidates.length;
 const key=candidates[index];voiceReactionPrevious[group]=key;voiceReactionLastKey=key;return key;
}
function voiceReactionGroup(key){
 if(key==='good'){
  if(voiceReactionPetAction&&['room','companion'].includes(state.screen))return 'pet_'+voiceReactionPetAction;
  if(state.screen==='mini'&&state.miniGame?.solved)return 'mini_finish';
  return 'success';
 }
 if(key==='retry')return 'retry';
 if(key==='helpShown')return 'hint';
 return null;
}
function voiceReactionCaption(text){
 let selector=null;
 if(state.screen==='game')selector='.feedback';
 else if(state.screen==='mini')selector=state.miniGame?.solved?'.mini-result > p':'.mini-notice';
 else if(['room','companion'].includes(state.screen))selector='.companion-feedback';
 const explicit=document.querySelector('[data-voice-reaction-caption]');
 const target=explicit||(selector?document.querySelector(selector):null);
 if(target)target.textContent=text;
}
function speakReaction(group,options={}){
 const fallback=typeof options?.fallback==='string'?options.fallback:'good';
 if(!state.sound){state.voiceReaction=null;voiceReactionBaseSpeak(fallback);return fallback}
 const key=chooseVoiceReaction(group);
 if(!key){state.voiceReaction=null;voiceReactionBaseSpeak(fallback);return fallback}
 const text=voiceReactionText(key);
 state.voiceReaction={key,text,group};
 voiceReactionCaption(text);
 voiceReactionBaseSpeak(key);
 return key;
}
speak=function(key){
 const group=voiceReactionGroup(key);
 if(group)return speakReaction(group,{fallback:key});
 state.voiceReaction=null;
 return voiceReactionBaseSpeak(key);
};

// A scoped call context prevents an old petFeedback value from changing a
// later educational success into a feeding/playing reaction.
if(typeof petCare==='function'){
 const voiceReactionBasePetCare=petCare;
 petCare=function(action){
  const previous=voiceReactionPetAction;
  voiceReactionPetAction=['room','companion'].includes(state.screen)&&['feed','play','brush'].includes(action)?action:null;
  try{return voiceReactionBasePetCare(action)}finally{voiceReactionPetAction=previous}
 };
}

let installPrompt=null;
let offlineState={protocol:3,coreReady:false,ready:false,downloaded:0,total:Object.keys(AUDIO).length,busy:false,failed:false};
const isStandalone=typeof POLINA_BUILD!=='undefined'&&POLINA_BUILD.standalone;
const isPreview=typeof POLINA_BUILD!=='undefined'&&POLINA_BUILD.preview===true;
function updateOfflineStatus(value){
 if(value?.protocol!==3){const el=document.getElementById('pwa-status');if(el)el.textContent='Обновляем игру для быстрого запуска…';return}
 offlineState={...offlineState,...value};if(isPreview)offlineState.ready=false;document.documentElement.dataset.offlineReady=String(offlineState.ready);document.documentElement.dataset.offlineCoreReady=String(offlineState.coreReady);
 const el=document.getElementById('pwa-status'),button=document.getElementById('pwa-offline-button'),progress=document.getElementById('pwa-offline-progress');
 if(el)el.textContent=isPreview?`Предпросмотр интерфейса. Доступно ${POLINA_BUILD.readyVoices} из ${POLINA_BUILD.totalVoices} реплик. Полная озвучка ещё не готова.`:isStandalone?'Скачанный файл содержит игру, картинки и всю озвучку. Интернет для игры не нужен.':offlineState.ready?'Вся игра и озвучка сохранены. Можно играть без интернета.':offlineState.busy?`Сохраняем озвучку: ${offlineState.downloaded} из ${offlineState.total}. Пока можно играть; не закрывайте эту вкладку.`:offlineState.failed?`Сохранено ${offlineState.downloaded} из ${offlineState.total} реплик. Не удалось скачать всё. Проверьте интернет и попробуйте ещё раз.`:offlineState.coreReady?`Игра сохранена для быстрого запуска. Озвучка загружена: ${offlineState.downloaded} из ${offlineState.total}. Для игры без интернета сохраните все реплики кнопкой ниже.`:'Для первого запуска на устройстве нужен интернет.';
 if(button){button.disabled=offlineState.busy;button.hidden=isStandalone||offlineState.ready;button.textContent=offlineState.busy?'Сохраняем…':offlineState.failed?'Попробовать сохранить ещё раз':'Сохранить всю игру без интернета'}
 if(progress){progress.hidden=isStandalone||(!offlineState.busy&&!offlineState.downloaded)||offlineState.ready;progress.max=offlineState.total;progress.value=offlineState.downloaded}
}
function workerMessage(worker,type,onMessage){const channel=new MessageChannel();let timer;const arm=()=>{clearTimeout(timer);timer=setTimeout(()=>{channel.port1.close();if(type==='CACHE_OFFLINE')updateOfflineStatus({...offlineState,busy:false,failed:true})},type==='CACHE_OFFLINE'?35000:10000)};channel.port1.onmessage=event=>{clearTimeout(timer);onMessage(event.data);if(type==='OFFLINE_STATUS'||!event.data.busy)channel.port1.close();else arm()};arm();worker.postMessage({type},[channel.port2]);return channel}
function checkOfflineStatus(){
 if(isStandalone){updateOfflineStatus({protocol:3,coreReady:true,ready:true,downloaded:Object.keys(AUDIO).length,total:Object.keys(AUDIO).length,busy:false});return}
 if(typeof navigator==='undefined'||!navigator.serviceWorker)return;
 navigator.serviceWorker.ready.then(reg=>{const worker=navigator.serviceWorker.controller||reg.active;if(worker)workerMessage(worker,'OFFLINE_STATUS',updateOfflineStatus)}).catch(()=>{});
}
function saveOfflineGame(){if(isStandalone||offlineState.busy||typeof navigator==='undefined'||!navigator.serviceWorker)return;navigator.serviceWorker.ready.then(reg=>{const worker=navigator.serviceWorker.controller||reg.active;if(!worker)return;updateOfflineStatus({...offlineState,busy:true,failed:false});workerMessage(worker,'CACHE_OFFLINE',updateOfflineStatus)}).catch(()=>updateOfflineStatus({...offlineState,busy:false,failed:true}))}
const baseParents=parents;
parents=function(){baseParents();root.innerHTML=root.innerHTML.replace('<section class="parent-about">',`<section class="parent-about android-info"><h2>На телефоне Android</h2><p>Откройте ссылку на игру в Chrome на телефоне. Вход в аккаунт не нужен. В меню браузера выберите «Добавить на главный экран» или «Установить приложение». Появится значок Полины.</p><button class="btn secondary" data-action="installPolina" id="pwa-install-button" ${installPrompt?'':'hidden'}>${art('room')}Добавить на главный экран</button><p>Первый экран открывается отдельно от озвучки. Во время игры скачиваются только нужные реплики. Если хотите играть без интернета, один раз сохраните весь комплект:</p><p id="pwa-status" class="pwa-status">Проверяем сохранённую игру…</p><progress id="pwa-offline-progress" style="width:100%;accent-color:#52785b" hidden></progress><button class="btn secondary" data-action="savePolinaOffline" id="pwa-offline-button">Сохранить всю игру без интернета</button><p>Кнопки рассчитаны на касания. В раскраске есть увеличение. Комната и прогресс сохраняются на этом устройстве; телефон и компьютер не синхронизируются.</p></section><section class="parent-about">`);updateOfflineStatus(offlineState);checkOfflineStatus()};
if(typeof window.addEventListener==='function'){
 window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;const button=document.getElementById('pwa-install-button');if(button)button.hidden=false});
 window.addEventListener('appinstalled',()=>{installPrompt=null;const button=document.getElementById('pwa-install-button');if(button)button.hidden=true});
 if(!isStandalone&&typeof navigator!=='undefined'&&'serviceWorker' in navigator&&typeof location!=='undefined'&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.addEventListener('controllerchange',checkOfflineStatus);navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(checkOfflineStatus).catch(()=>updateOfflineStatus({...offlineState,busy:false,failed:true}))}
}
root.addEventListener('click',async event=>{const el=event.target.closest('button[data-action]');if(!el)return;if(el.dataset.action==='savePolinaOffline'){saveOfflineGame();return}if(el.dataset.action!=='installPolina'||!installPrompt)return;const prompt=installPrompt;installPrompt=null;await prompt.prompt();await prompt.userChoice;el.hidden=true});
</script></body></html>
