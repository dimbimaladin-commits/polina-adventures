# Based on https://github.com/actions/starter-workflows/blob/main/pages/static.yml
# Save this file in the repository as .github/workflows/publish-game.yml.
name: Publish Polina game to Pages

on:
  push:
    branches: [main]
    paths:
      - 'release/game-dist.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare verified static frontend
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, stat, zipfile
          from pathlib import Path, PurePosixPath

          required = {'index.html', 'sw.js', 'manifest.webmanifest', 'icon-192.png', 'icon-512.png'}
          manifest_name = 'release-manifest.json'
          with zipfile.ZipFile('release/game-dist.zip') as archive:
              manifest = json.loads(archive.read(manifest_name))
              assert manifest['schema'] == 1 and manifest['app'] == 'polina-adventures'
              rows = manifest['files']
              paths = {row['path'] for row in rows}
              assert len(rows) == len(paths) and required <= paths
              assert len(archive.infolist()) == len(paths) + 1
              assert set(archive.namelist()) == paths | {manifest_name}
              assert manifest['audio_clips'] == 415
              assert sum(name.startswith('audio/') and name.endswith('.mp3') for name in paths) == manifest['audio_clips']
              for info in archive.infolist():
                  name, path = info.filename, PurePosixPath(info.filename)
                  assert not path.is_absolute() and str(path) == name and chr(92) not in name
                  assert all(not part.startswith('.') and ':' not in part for part in path.parts)
                  assert not stat.S_ISLNK(info.external_attr >> 16) and not info.is_dir()
                  assert name in required | {manifest_name} or (
                      len(path.parts) == 2 and (
                          path.parts[0] == 'audio' and path.suffix == '.mp3' or
                          path.parts[0] == 'art' and path.suffix in {'.webp', '.png', '.jpg', '.jpeg', '.svg'}))
              for row in rows:
                  data = archive.read(row['path'])
                  assert len(data) == row['bytes']
                  assert hashlib.sha256(data).hexdigest() == row['sha256'], row['path']
              destination = Path('public')
              destination.mkdir(exist_ok=False)
              archive.extractall(destination)
          print(f"Verified build {manifest['version']}: {manifest['audio_clips']} voices, {len(paths)} frontend files")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
